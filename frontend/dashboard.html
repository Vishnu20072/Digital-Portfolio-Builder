
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Digital Portfolio Builder</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard-container">

        <header class="dashboard-header">
            <h1>Digital Portfolio Builder</h1>
            <button id="logoutBtn">Logout</button>
        </header>

        <main class="dashboard-content">

            <h2 id="welcomeMessage">Welcome!</h2>

            <p>Create and manage your professional portfolio.</p>

            <div class="dashboard-cards">

                <!-- Profile Card -->
                <div class="dashboard-card">
                    <h3>My Profile</h3>
                    <p>Create and manage your personal information.</p>
                    <button onclick="window.location.href='profile.html'">
                        Create Profile
                    </button>
                </div>

                <!-- Projects Card -->
                <div class="dashboard-card">
                    <h3>My Projects</h3>
                    <p>Add and manage your projects.</p>
                    <button onclick="window.location.href='projects.html'">
                        Add Projects
                    </button>
                </div>

                <!-- Portfolio Card -->
                <div class="dashboard-card">
                    <h3>My Portfolio</h3>
                    <p>Build your professional portfolio.</p>
                    <button onclick="window.location.href='portfolio.html'">
                        Build Portfolio
                    </button>
                </div>

            </div>

        </main>

    </div>

    <script src="js/dashboard.js"></script>

</body>
</html>
